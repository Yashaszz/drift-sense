name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to exact release tags, not floating majors. Not every
      # action publishes a floating major: setup-uv released v9.0.0 without a
      # `v9` tag, and `@v9` fails to resolve before checkout even runs.
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `uv sync` builds an isolated project venv from the committed lockfile.
      # An earlier revision used `uv pip install --system`, which fails on
      # ubuntu-latest: its interpreter is PEP 668 externally-managed and uv
      # rightly refuses to install into it. The Python version comes from
      # .python-version, so CI and every developer machine agree.
      - name: Install project
        run: uv sync --locked --all-extras

      - name: Ruff (lint)
        run: uv run ruff check src tests benchmarks

      - name: Ruff (format)
        run: uv run ruff format --check src tests benchmarks

      - name: MyPy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest
