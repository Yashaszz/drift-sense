[project]
name = "drift-sense"
version = "0.1.0"
description = "Navigation-error recovery: locate a zoomed-in SEM reference inside a zoomed-out search image."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Runtime dependencies. Pinned loosely here; the submission ships an exact
# `pip freeze` (see docs/ and the packaging task, T11).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
drift-localize = "src.localize:main"
# generate_dataset already sets prog="drift-generate-dataset", so its usage and
# error messages name this command. Without the entry point those messages
# pointed at something that did not exist.
drift-generate-dataset = "src.generate_dataset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "D203",  # conflicts with D211 (blank line before class docstring)
    "D213",  # conflicts with D212 (multi-line summary position)
]

[tool.ruff.lint.per-file-ignores]
# Tests may skip docstring and annotation rules, and use bare asserts.
"tests/*" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------------------
# MyPy — strict on our own source only
# ---------------------------------------------------------------------------
[tool.mypy]
# Analysis target is 3.12 even though the project runs on 3.11+: recent NumPy
# ships stubs written with 3.12-only `type` statements, which mypy cannot parse
# when pinned lower. This affects type checking only, not runtime support.
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
# Third-party scientific packages ship incomplete or absent stubs.
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
]
